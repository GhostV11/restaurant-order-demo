<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <title>Ռեստորանի Պատվեր</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #fefefe;
      color: #333;
    }
    .language-switcher {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
    }
    .language-switcher button {
      padding: 5px 10px;
      border: none;
      background: #ccc;
      border-radius: 5px;
      cursor: pointer;
    }
    h1 {
      text-align: center;
    }
    #tables {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .table {
      border: 2px solid #007BFF;
      border-radius: 8px;
      padding: 10px;
      width: 300px;
      background: #f9f9f9;
    }
    .item-row {
      display: flex;
      justify-content: space-between;
    }
    select, input[type=number] {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      padding: 6px;
      font-size: 14px;
      border-radius: 4px;
      border: none;
      background: #007BFF;
      color: white;
      cursor: pointer;
    }
    .order-summary {
      margin-top: 10px;
      background: #f1f1f1;
      padding: 8px;
      border-radius: 5px;
    }
    .input-row {
      display: grid;
      grid-template-columns: 1fr 50px 40px;
      gap: 5px;
      margin: 5px 0;
    }
    .order-confirmation {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="language-switcher">
  <button onclick="setLanguage('hy')">ARM</button>
  <button onclick="setLanguage('ru')">RUS</button>
  <button onclick="setLanguage('en')">ENG</button>
</div>

<h1 id="title">Ռեստորանի Պատվեր</h1>

<div id="tables"></div>

<div id="kitchen-orders" style="margin-top: 30px;">
  <h2>Պատվերներ Կիրճի Համար</h2>
  <div id="kitchen-order-list"></div>
</div>

<script>
  const menu = {
    food: ["Խորոված", "Քեբաբ", "Բորշ", "Խաշլամա", "Տապակած Ձուկ", "Դոլմա", "Լոբիով փլավ", "Ստեյք", "Կոտլետ", "Օմլետ"],
    drinks: ["Ջուր", "Կոկա-Կոլա", "Ֆանտա", "Սփրայթ", "Հյութ", "Սուրճ", "Թեյ", "Գարեջուր", "Գինի", "Խմիչք"],
    desserts: ["Տորթ", "Շոկոլադ", "Մրգային աղանդեր", "Սուզի", "Պաղպաղակ", "Մուս", "Բլիթ", "Մակարոն", "Ջեմով խմորեղեն", "Չիզքեյք"]
  };

  let language = 'hy';
  const carts = Array(20).fill().map(() => []);
  const kitchenOrders = [];

  function createTables() {
    const tablesContainer = document.getElementById('tables');
    for (let i = 1; i <= 20; i++) {
      const tableDiv = document.createElement('div');
      tableDiv.className = 'table';
      tableDiv.innerHTML = `
        <h3>Սեղան ${i}</h3>
        <select onchange="renderItems(this, ${i - 1})">
          <option value="" disabled selected>--- Ընտրեք Մենյու ---</option>
          <option value="food">Ուտեստներ</option>
          <option value="drinks">Խմիչքներ</option>
          <option value="desserts">Աղանդեր</option>
        </select>
        <div class="input-row">
          <div id="itemSelector${i}"></div>
          <input type="number" id="quantity${i}" min="1" value="1" />
          <button onclick="addToCart(${i - 1})">➕</button>
        </div>
        <div class="order-summary" id="cart${i}"></div>
        <button onclick="sendToKitchen(${i - 1})">📤 Սփսղել Կիրճի</button>
        <div class="order-confirmation" id="confirmation${i}"></div>
        <button onclick="printCheck(${i - 1})">🖨️ Տպել Չեկը</button>
        <button onclick="refreshTable(${i - 1})">🔄 Նորացնել</button>
        <button onclick="clearCart(${i - 1})">🗑️ Վերացնել Պատվերը</button>
      `;
      tablesContainer.appendChild(tableDiv);
    }
  }

  function renderItems(selectEl, tableIndex) {
    const category = selectEl.value;
    const itemSelector = document.getElementById(`itemSelector${tableIndex + 1}`);
    itemSelector.innerHTML = '';
    const itemDropdown = document.createElement('select');
    itemDropdown.id = `item${tableIndex}`;
    menu[category].forEach(item => {
      const opt = document.createElement('option');
      opt.value = item;
      opt.textContent = item;
      itemDropdown.appendChild(opt);
    });
    itemSelector.appendChild(itemDropdown);
  }

  function addToCart(index) {
    const item = document.getElementById(`item${index}`).value;
    const quantity = parseInt(document.getElementById(`quantity${index + 1}`).value);
    const cart = carts[index];
    const found = cart.find(x => x.item === item);
    if (found) {
      found.quantity += quantity;
    } else {
      cart.push({ item, quantity });
    }
    updateCart(index);
  }

  function updateCart(index) {
    const cartDiv = document.getElementById(`cart${index + 1}`);
    cartDiv.innerHTML = '<h4>Զամբյուղ</h4>';
    let total = 0;
    carts[index].forEach(({ item, quantity }) => {
      const price = 1000;
      total += price * quantity;
      cartDiv.innerHTML += `<div class="item-row"><span>${item} × ${quantity}</span><span>${price * quantity} ֏</span></div>`;
    });
    const tip = Math.round(total * 0.1);
    cartDiv.innerHTML += `<div class="item-row"><strong>Ընդամենը</strong><span>${total} ֏</span></div>`;
    cartDiv.innerHTML += `<div class="item-row">Թեյավճար (10%)<span>${tip} ֏</span></div>`;
    cartDiv.innerHTML += `<div class="item-row"><strong>Ընդհանուր Գումար</strong><span>${total + tip} ֏</span></div>`;
  }

  function printCheck(index) {
    let check = `Չեկ - Սեղան ${index + 1}\n\n`;
    let total = 0;
    carts[index].forEach(({ item, quantity }) => {
      const price = 1000;
      total += price * quantity;
      check += `${item} × ${quantity} = ${price * quantity} ֏\n`;
    });
    const tip = Math.round(total * 0.1);
    check += `\nԸնդամենը: ${total} ֏\nԹեյավճար: ${tip} ֏\nԸնդհանուր: ${total + tip} ֏`;
    const newWindow = window.open('', '', 'width=300,height=500');
    newWindow.document.write(`<pre>${check}</pre>`);
    newWindow.print();
  }

  function sendToKitchen(tableIndex) {
    const cart = carts[tableIndex];
    const orderDetails = cart.map(({ item, quantity }) => `${item} × ${quantity}`).join(', ');
    kitchenOrders.push({ tableIndex, orderDetails });
    updateKitchenOrders();
    document.getElementById(`confirmation${tableIndex + 1}`).innerHTML = 'Պատվեր ուղարկվեց կիրճին';
  }

  function updateKitchenOrders() {
    const kitchenOrderList = document.getElementById('kitchen-order-list');
    kitchenOrderList.innerHTML = '';
    kitchenOrders.forEach((order, index) => {
      kitchenOrderList.innerHTML += `
        <div>
          <h4>Սեղան ${order.tableIndex + 1}</h4>
          <p>${order.orderDetails}</p>
          <button onclick="markOrderAsDone(${index})">🟢 Պատվեր պատրաստ է</button>
        </div>
      `;
    });
  }

  function markOrderAsDone(orderIndex) {
    const order = kitchenOrders[orderIndex];
    document.getElementById(`confirmation${order.tableIndex + 1}`).innerHTML = 'Պատվեր պատրաստ է';
    kitchenOrders.splice(orderIndex, 1);
    updateKitchenOrders();
  }

  function refreshTable(tableIndex) {
    updateCart(tableIndex);
    document.getElementById(`confirmation${tableIndex + 1}`).innerHTML = '';
  }

  function clearCart(tableIndex) {
    carts[tableIndex] = [];
    updateCart(tableIndex);
    document.getElementById(`confirmation${tableIndex + 1}`).innerHTML = '';
  }

  function setLanguage(lang) {
    language = lang;
    document.getElementById('title').innerText = {
      hy: 'Ռեստորանի Պատվեր',
      ru: 'Заказ в Ресторане',
      en: 'Restaurant Order'
    }[lang];
  }

  createTables();
</script>

</body>
</html>
